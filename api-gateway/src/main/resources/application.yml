server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: course-service-route
          uri: lb://course-service
          predicates:
            - Path=/course/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/