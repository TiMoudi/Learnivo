<div class="row">
  <div class="col-md-8">
    <app-card [cardTitle]="isEdit ? 'Edit Event' : 'Add Event'" [options]="false">
      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
        <div *ngIf="error" class="alert alert-danger" role="alert">
          {{ error }}
        </div>

        <div class="form-group">
          <label for="title">Title <span class="text-danger">*</span></label>
          <input type="text" id="title" class="form-control" formControlName="title" placeholder="Event title">
          <small class="text-danger" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">
            Title is required.
          </small>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" class="form-control" formControlName="description" rows="3" placeholder="Event description"></textarea>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="startTime">Start Time <span class="text-danger">*</span></label>
              <input type="datetime-local" id="startTime" class="form-control" formControlName="startTime">
              <small class="text-danger" *ngIf="form.get('startTime')?.invalid && form.get('startTime')?.touched">
                Start time is required.
              </small>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="endTime">End Time <span class="text-danger">*</span></label>
              <input type="datetime-local" id="endTime" class="form-control" formControlName="endTime">
              <small class="text-danger" *ngIf="form.get('endTime')?.invalid && form.get('endTime')?.touched">
                End time is required.
              </small>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location (OpenStreetMap)</label>
          <div class="input-group">
            <input
              type="text"
              id="location"
              class="form-control"
              formControlName="location"
              placeholder="Search address or click on map"
              (input)="onLocationSearch()"
              (focus)="onLocationSearch()"
            />
            <div class="input-group-append">
              <button type="button" class="btn btn-outline-secondary" (click)="onShowOnMap()" [disabled]="mapGeocoding || !form.get('location')?.value?.trim()">
                <span *ngIf="mapGeocoding" class="spinner-border spinner-border-sm mr-1" role="status"></span>
                <i class="feather icon-map-pin"></i> Show on map
              </button>
            </div>
          </div>
          <small class="form-text text-muted">Type an address for suggestions, or click on the map to set the location.</small>
          <div class="list-group mt-1" *ngIf="showSuggestions && locationSuggestions.length">
            <button
              type="button"
              class="list-group-item list-group-item-action list-group-item-sm"
              *ngFor="let s of locationSuggestions"
              (click)="selectSuggestion(s)"
            >
              {{ s.displayName }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Map</label>
          <div id="event-location-map" class="event-location-map" style="min-height: 280px; width: 100%;"></div>
        </div>

        <div class="form-group">
          <label for="status">Status <span class="text-danger">*</span></label>
          <select id="status" class="form-control" formControlName="status">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="form-group mt-3">
          <button type="submit" class="btn btn-primary mr-2" [disabled]="form.invalid || submitting">
            <span *ngIf="submitting" class="spinner-border spinner-border-sm mr-1" role="status"></span>
            {{ isEdit ? 'Update' : 'Create' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        </div>
      </form>
    </app-card>
  </div>
</div>
