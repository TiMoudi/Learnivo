<div class="row">
  <div class="col-12">
    <app-card cardTitle="Events" [options]="true">
      <button class="btn btn-primary btn-sm mb-3" (click)="onAdd()">
        <i class="feather icon-plus"></i> Add Event
      </button>

      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>

      <div *ngIf="!loading && !error && events.length === 0" class="alert alert-info">
        No events yet. Click "Add Event" to create one.
      </div>

      <div class="table-responsive" *ngIf="!loading && events.length > 0">
        <table class="table table-hover table-striped">
          <thead>
            <tr>
              <th>Title</th>
              <th>Start</th>
              <th>End</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let event of events">
              <td>{{ event.title }}</td>
              <td>{{ formatDate(event.startTime) }}</td>
              <td>{{ formatDate(event.endTime) }}</td>
              <td>{{ event.location || '-' }}</td>
              <td>
                <span class="badge" [ngClass]="{
                  'badge-primary': event.status === 'SCHEDULED',
                  'badge-info': event.status === 'ONGOING',
                  'badge-success': event.status === 'COMPLETED',
                  'badge-secondary': event.status === 'CANCELLED'
                }">{{ event.status }}</span>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-primary mr-1" (click)="onEdit(event.id!)" title="Edit">
                  <i class="feather icon-edit-2"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" (click)="onDelete(event)" title="Delete">
                  <i class="feather icon-trash-2"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
</div>
